name: Run tests

on:
    workflow_dispatch:
        inputs:
            test-filter:
                description: 'Optional node --test name pattern; empty runs the full suite'
                required: false
                default: ''

jobs:
    test:
        timeout-minutes: 30
        strategy:
            matrix:
                node: [18.x, 20.x]
                os: [ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v2
            - name: Use Node.js ${{ matrix.node }}
              uses: actions/setup-node@v1
              with:
                  node-version: ${{ matrix.node }}
            - run: npm install
            - run: |
                  if [ -n "${{ inputs.test-filter }}" ]; then
                      npx c8 node --test --test-concurrency=1 --test-name-pattern="${{ inputs.test-filter }}" test/**/*.test.js test/**/*-test.js
                  else
                      npm run test:coverage
                  fi
            - name: Pack
              if: matrix.node == '18.x'
              run: npm pack
            - uses: actions/upload-artifact@v4
              if: matrix.node == '18.x'
              with:
                  name: nodemailer-tgz
                  path: nodemailer-*.tgz
                  if-no-files-found: error
